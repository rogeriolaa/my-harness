name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # engines requires node >=23.6 (native TypeScript type-stripping).
      # "23" resolves to the latest 23.x, which satisfies that.
      - uses: actions/setup-node@v7
        with:
          node-version: 23
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
